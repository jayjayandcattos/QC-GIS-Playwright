[project]
name = "qc-gis-playwright"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "playwright>=1.65.2",
    "pytest-playwright>=0.10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
# The console must be running; override with --base-url for another copy.
addopts = "--base-url http://127.0.0.1:3000 --browser chromium"
